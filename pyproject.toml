[project]
name = "ethqrng"
version = "0.1.0"
description = "Ultra-Secure Quantum Ethereum Wallet Generator using IBM Quantum and enhanced entropy mixing"
requires-python = ">=3.12.4"
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.20.0",
    "eth-account>=0.11.0",
    "web3>=6.15.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pyperclip>=1.8.0",
    # API dependencies
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethqrng"]
